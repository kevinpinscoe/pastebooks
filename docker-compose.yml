name: pastebooks

services:
  db:
    image: mysql:8.4
    container_name: pastebooks-db-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: charmsdb
    volumes:
      - pastebooks-dbdata:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro,z
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-prootpass"]
      interval: 5s
      retries: 20

  app:
    image: pastebooks:dev
    build: .
    container_name: pastebooks-dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_DSN: "root:rootpass@tcp(db:3306)/charmsdb?parseTime=true&charset=utf8mb4"
      AUTH_DISABLED: "0"
      COOKIE_SECURE: "false"
    volumes:
      - ./config.yaml:/app/config.yaml:ro,z
      - ./frontend:/app/frontend:ro,z
    command: ["/app/server", "-config", "/app/config.yaml"]

volumes:
  pastebooks-dbdata:
name: build-and-push

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # write, not read: the SBOM export step creates the GitHub release for the tag
      # if one does not exist, then uploads the SPDX documents to it
      contents: write
      packages: write
      # Required for Cosign keyless (OIDC token exchange with Sigstore)
      id-token: write
      # Required to upload the Grype SARIF report to the Security tab
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU enables cross-arch emulation so we can output amd64+arm64
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      # Buildx is required for multi-platform + caching (BuildKit)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: docker-container

      # Generate tags/labels:
      # - v1.0.1 (exact tag you pushed)
      # - latest (always on tag pushes)
      # - sha-... (immutable traceability)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha
          labels: |
            org.opencontainers.image.source=${{ github.repository }}

      # GHCR login with the repo's token (grants package:write via job permissions)
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & push: multi-arch + GHA cache
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.repository }}
          cache-to: type=gha,mode=max,scope=${{ github.repository }}
          # Bind an SPDX SBOM and SLSA provenance to the pushed digest. These are
          # registry attestations on the manifest list, not files — which is why the
          # docker-container driver and push: true above are load-bearing. The classic
          # image store cannot hold them. Do not "simplify" either away.
          sbom: true
          provenance: mode=max

      # Resolve each platform's own digest out of the manifest list.
      #
      # steps.build.outputs.digest is the digest of the manifest LIST, and Grype
      # resolves a manifest list to the RUNNER's platform. That is why the gate enabled
      # on 2026-08-08 covered linux/amd64 only while linux/arm64 shipped unscanned —
      # built, signed, carrying its own SBOM, and never checked for CVEs.
      #
      # anchore/scan-action has no platform input. That was read from action.yml at the
      # pinned SHA rather than assumed, so the gap cannot be closed with a flag. Passing
      # a per-platform digest as image: targets that platform directly instead.
      #
      # Verified 2026-08-08 before this was written: grype's reported source imageID
      # (the image CONFIG digest) matches the config digest the registry lists for the
      # arm64 manifest, so this genuinely analyses arm64 rather than silently
      # re-scanning the runner's own architecture.
      - name: Resolve the per-platform digests
        id: digests
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository }}@${DIGEST}"
          docker buildx imagetools inspect --raw "$IMAGE" > manifest-list.json

          for arch in amd64 arm64; do
            # os == "linux" also excludes the attestation manifests, which carry
            # architecture "unknown" and are not scannable images.
            d=$(jq -r --arg a "$arch" \
              '.manifests[] | select(.platform.architecture == $a and .platform.os == "linux") | .digest' \
              manifest-list.json)
            # An empty digest would reach the scan step as `image: ...@` and fail in a
            # way that reads like a scanner fault. Fail here, naming the real cause.
            [ -n "$d" ] || { echo "::error::no linux/$arch manifest in $IMAGE"; exit 1; }
            echo "$arch=$d" >> "$GITHUB_OUTPUT"
            echo "linux/$arch -> $d"
          done

      # Scan each published platform digest. BLOCKING as of 2026-08-08; arm64 joined
      # the gate on 2026-08-08 (gitops PLAN.md item 11a).
      #
      # This gate ran warn-only from 2026-08-04 while the image carried 29 findings at
      # or above high, later 3, all in libc6 and all marked wont-fix by Debian — so no
      # rebuild would ever have cleared them.
      #
      # They were removed rather than waived. The final stage moved from
      # distroless/base-debian12 to distroless/static-debian12: the binary is built
      # CGO_ENABLED=0 with pure-Go dependencies, so glibc was present but unreachable.
      # Measured after the change: ZERO findings at any severity, on BOTH platforms —
      # arm64 was measured directly on 2026-08-08 and had 0 matches at any severity.
      # There is no .vex/openvex.json here because nothing needed dispositioning.
      #
      # If this starts failing, the finding is real. Fix it, or remove the package,
      # or — only with evidence that the vulnerable code is not reachable — add an
      # OpenVEX statement and pass it via a vex: input. Do NOT raise severity-cutoff,
      # and do NOT delete either scan.
      - name: Scan the published image for CVEs (linux/amd64)
        id: scan-amd64
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.digests.outputs.amd64 }}
          severity-cutoff: high
          fail-build: true
          output-format: sarif

      # Each upload sits immediately after its own scan, so the report is consumed
      # before the next scan runs. Do not reorder them into scan/scan/upload/upload.
      #
      # The categories must stay distinct: two SARIF uploads sharing one category
      # overwrite each other in the Security tab, so a single "grype-container" for
      # both platforms would show one arch and silently discard the other.
      - name: Upload the scan results (linux/amd64)
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: always() && steps.scan-amd64.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.scan-amd64.outputs.sarif }}
          category: grype-container-amd64

      # if: always() so a failing amd64 scan does not hide arm64's result. Without it
      # the job stops at the first failing platform, you fix that one, cut another
      # release, and only then discover the second was failing too.
      - name: Scan the published image for CVEs (linux/arm64)
        id: scan-arm64
        if: always() && steps.digests.outputs.arm64 != ''
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.digests.outputs.arm64 }}
          severity-cutoff: high
          fail-build: true
          output-format: sarif

      - name: Upload the scan results (linux/arm64)
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: always() && steps.scan-arm64.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.scan-arm64.outputs.sarif }}
          category: grype-container-arm64

      # Install Cosign for keyless image signing
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Sign the published image digest with Cosign keyless (OIDC → Sigstore transparency log)
      # The digest is used rather than a mutable tag to ensure the signature is pinned
      - name: Sign image with Cosign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images="${images} ${tag}@${DIGEST}"
          done
          cosign sign --yes ${images}

      # Export the SBOM attestation as a release record.
      #
      # The registry attestation written by sbom: true above is the source of truth;
      # these files exist only so an auditor can read the inventory from the release
      # page without a registry client. They are a copy, and they can drift — always
      # reconcile against the digest, not against these.
      #
      # The .SBOM key shape is asserted rather than assumed: on a multi-platform
      # build it is keyed by platform, and a jq path that silently yields null would
      # otherwise produce an empty file that looks like a clean SBOM.
      - name: Export the SBOM as a release record
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository }}@${DIGEST}"
          docker buildx imagetools inspect "$IMAGE" --format '{{ json .SBOM }}' > sbom-raw.json

          echo "SBOM top-level keys:"
          jq -r 'keys[]' sbom-raw.json

          for plat in linux/amd64 linux/arm64; do
            out="sbom.${plat/\//-}.spdx.json"
            jq -e --arg p "$plat" '.[$p].SPDX' sbom-raw.json > "$out" || {
              echo "::error::no SPDX document at .[\"$plat\"].SPDX — the .SBOM key shape is not what this step expects"
              exit 1
            }
            pkgs=$(jq '.packages | length' "$out")
            echo "$out: $pkgs packages"
            # An empty SBOM is indistinguishable from a passing one at a glance. A
            # static binary in a distroless final stage has no package database, so a
            # final-stage-only scan yields nothing and reports success. Fail loudly.
            [ "$pkgs" -gt 0 ] || { echo "::error::$out is empty"; exit 1; }

            # Each stage marked BUILDKIT_SBOM_SCAN_STAGE=true gets its OWN SPDX
            # document under AdditionalSPDXs. Buildkit does NOT merge them into
            # .SPDX, so exporting only .SPDX drops precisely the dependency graph
            # that marking those stages exists to capture. Measured on v1.2.1:
            # .SPDX held 32 packages while the two build stages held 258 and 221.
            n=$(jq --arg p "$plat" '.[$p].AdditionalSPDXs? // [] | length' sbom-raw.json)
            echo "$plat: $n additional build-stage SPDX document(s)"
            i=0
            while [ "$i" -lt "$n" ]; do
              name=$(jq -r --arg p "$plat" --argjson i "$i" \
                '.[$p].AdditionalSPDXs[$i].name // "stage\($i)"' sbom-raw.json)
              aout="sbom.${plat/\//-}.${name}.spdx.json"
              jq -e --arg p "$plat" --argjson i "$i" \
                '.[$p].AdditionalSPDXs[$i]' sbom-raw.json > "$aout"
              echo "$aout: $(jq '.packages | length' "$aout") packages"
              i=$((i + 1))
            done
          done

          echo "Exported SBOM documents:"; ls -1 sbom.*.spdx.json

      # This repo publishes tags but has never created GitHub releases, so there is
      # nothing for `gh release upload` to attach to — it would fail on a missing
      # release rather than on anything to do with the SBOM. Create the release for
      # this tag first if it does not exist.
      - name: Attach the SBOM to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "No release for $TAG — creating one."
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          # Glob, not a fixed list: the build-stage documents are named after the
          # stages, so a new marked stage is picked up without editing this step.
          gh release upload "$TAG" sbom.*.spdx.json --clobber
